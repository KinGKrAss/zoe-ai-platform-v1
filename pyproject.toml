[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoe-ai-platform"
version = "1.0.0"
description = "Z1 Sovereign AI Platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
dev = [
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["apps*", "services*"]
exclude = ["database*", "integrations*", "infrastructure*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["apps", "services"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["services/ppt/backend", "services/zoe-memory", "services/z1-core"]
addopts = "-ra --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["apps", "services"]
