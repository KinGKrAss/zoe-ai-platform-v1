services:
  zoe-test:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    environment:
      Z1_ENV: development
      DATABASE_URL: postgresql://zoe:zoe@postgres:5432/zoe
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zoe
      POSTGRES_USER: zoe
      POSTGRES_PASSWORD: zoe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoe -d zoe"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - zoe-postgres:/var/lib/postgresql/data

volumes:
  zoe-postgres:
