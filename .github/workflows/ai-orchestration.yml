name: Zoë AI Orchestration CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'codex/**']

permissions:
  contents: read

jobs:
  orchestration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/zoe-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q test_orchestration.py
      - run: python -m compileall -q orchestration server.py
