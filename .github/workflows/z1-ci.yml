name: Z1 CI

on:
  push:
    branches: [main, 'codex/**', 'agent/**', 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test,dev]'
      - name: Ruff
        run: ruff check .
      - name: CoinMarketCap connector tests
        run: pytest services/zoe_connectors/coinmarketcap/test_client.py -q
      - name: Tests
        run: pytest
