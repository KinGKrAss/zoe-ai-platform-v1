name: Z1 CI

on:
  push:
    branches: [main, 'codex/**', 'agent/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test,dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/ppt/backend:${{ github.workspace }}/services/zoe-memory:${{ github.workspace }}/services/z1-core
        run: pytest
