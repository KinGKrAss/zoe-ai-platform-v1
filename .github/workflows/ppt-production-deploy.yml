name: PPT Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-PPT to authorize production deployment'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY-PPT' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/ppt/contracts/package-lock.json
      - name: Install contract dependencies
        working-directory: services/ppt/contracts
        run: npm ci
      - name: Compile contracts
        working-directory: services/ppt/contracts
        run: npx hardhat compile
      - name: Deploy PPT
        working-directory: services/ppt/contracts
        env:
          PPT_ALLOW_DEPLOY: '1'
          PPT_ADMIN_ADDRESS: ${{ secrets.PPT_ADMIN_ADDRESS }}
          PRIVATE_KEY: ${{ secrets.PPT_DEPLOYER_PRIVATE_KEY }}
          RPC_URL: ${{ secrets.PPT_RPC_URL }}
        run: npx hardhat run scripts/deploy.js --network production
