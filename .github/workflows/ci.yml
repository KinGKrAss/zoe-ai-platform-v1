name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test,dev]'

      - name: Validate migration numbering
        run: python tools/check_migrations.py

      - name: Ruff
        run: ruff check services tools
        continue-on-error: true

      - name: Pytest
        run: python -m pytest

      - name: Coverage
        run: python -m pytest --cov --cov-report=term-missing
