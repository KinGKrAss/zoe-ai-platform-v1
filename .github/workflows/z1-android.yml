name: Z1 Android CI

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'apps/android/**'
      - '.github/workflows/z1-android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/z1-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease -Pz1ApiUrl="${{ vars.Z1_API_BASE_URL }}"

      - name: Build debug APK (installable)
        run: gradle --no-daemon :app:assembleDebug -Pz1ApiUrl="${{ vars.Z1_API_BASE_URL }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: z1-android-release
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: z1-android-debug-installable
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
