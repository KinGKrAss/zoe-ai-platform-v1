name: PPT CI

on:
  push:
    branches: [main, 'agent/**', 'codex/**']
  pull_request:

jobs:
  finanzfuchs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/finanzfuchs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=.. pytest -q

  rootstock-connector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rootstock-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: PYTHONPATH=. pytest -q

  verification-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/verification-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ppt/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: PYTHONPATH=. pytest ../tests/test_api.py

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ppt/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx hardhat compile
      - run: npx hardhat test
