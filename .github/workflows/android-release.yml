name: Z1 Android Release

on:
  push:
    branches: [main, feat/z1-android-platform]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      z1_api_url:
        description: 'Z1 API base URL'
        required: true
        default: 'http://10.0.2.2:8000'

env:
  Z1_API_URL: ${{ github.event.inputs.z1_api_url || vars.Z1_API_URL || 'http://10.0.2.2:8000' }}

jobs:
  android-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleRelease -Pz1ApiUrl="$Z1_API_URL"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: z1-android-release
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
