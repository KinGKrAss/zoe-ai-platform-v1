<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Z1 Command Center</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #0b0d12; color: #f5f5f5; }
    header { padding: 24px; border-bottom: 1px solid #252a35; }
    main { padding: 24px; max-width: 1100px; margin: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    .card { background: #131720; border: 1px solid #252a35; border-radius: 14px; padding: 18px; }
    .status { font-size: .85rem; opacity: .75; }
    .online { color: #7ee787; }
  </style>
</head>
<body>
  <header><strong>👑 Z1 Command Center</strong><div>Zoë AI Platform · Foundation + M2 App Shell</div></header>
  <main>
    <section class="card"><h1>Zoë Core</h1><p id="health">Verbinde…</p></section>
    <h2>Systemmodule</h2>
    <section id="modules" class="grid"></section>
  </main>
  <script>
    async function load() {
      const health = await fetch('/api/health').then(r => r.json());
      document.querySelector('#health').textContent = `${health.status.toUpperCase()} · ${health.version}`;
      const modules = await fetch('/api/modules').then(r => r.json());
      document.querySelector('#modules').innerHTML = modules.map(m =>
        `<article class="card"><h3>${m.name}</h3><div class="status ${m.status === 'online' ? 'online' : ''}">${m.status}</div></article>`
      ).join('');
    }
    load().catch(err => document.querySelector('#health').textContent = `Fehler: ${err.message}`);
  </script>
</body>
</html>
